<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Доступ к системам корабля</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <div class="logo-container text-center">
        <img src="static/img/mission_logo.png" alt="Эмблема миссии" class="mission-logo">
    </div>

    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="form-wrapper p-4 rounded shadow-lg">
            <h1 class="text-center text-primary mb-4">Форма доступа к системам корабля</h1>
            <form method="POST">
                <div class="mb-3">
                    <label for="astronaut_id" class="form-label">ID астронавта:</label>
                    <input type="text" class="form-control" id="astronaut_id" name="astronaut_id" required>
                </div>

                <div class="mb-3">
                    <label for="astronaut_password" class="form-label">Пароль астронавта:</label>
                    <input type="password" class="form-control" id="astronaut_password" name="astronaut_password" required>
                </div>

                <div class="mb-3">
                    <label for="captain_id" class="form-label">ID капитана или заместителя:</label>
                    <input type="text" class="form-control" id="captain_id" name="captain_id" required>
                </div>

                <div class="mb-3">
                    <label for="captain_password" class="form-label">Пароль капитана или заместителя:</label>
                    <input type="password" class="form-control" id="captain_password" name="captain_password" required>
                </div>

                <button type="submit" class="btn btn-primary w-100">Получить доступ</button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
